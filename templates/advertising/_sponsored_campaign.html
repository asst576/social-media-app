<article class="panel sponsored-card" aria-label="Sponsored content">
  <span class="sponsored-label">Sponsored</span>
  <p class="post-author">
    <span>{{ campaign.owner.profile.display_name }}</span>
    <span class="muted">@{{ campaign.owner.username }}</span>
  </p>
  <h2>{{ campaign.headline }}</h2>
  <p>{{ campaign.body|linebreaksbr }}</p>
  {% if campaign.image %}<img class="post-image" src="{{ campaign.image.url }}" alt="Sponsored image for {{ campaign.headline }}" loading="lazy">{% endif %}
</article>
